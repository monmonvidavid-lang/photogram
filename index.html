<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photogram</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,sans-serif; background:#fafafa; color:#262626; }
  .logo { font-family:"Brush Script MT","Segoe Script",cursive; font-size:30px;
          background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);
          -webkit-background-clip:text; background-clip:text;
          -webkit-text-fill-color:transparent; color:transparent; }
  header { background:#fff; padding:8px 12px; text-align:center;
           border-bottom:1px solid #dbdbdb; position:sticky; top:0; z-index:5; }
  header .logo { font-size:28px; cursor:pointer; }
  header button { position:absolute; right:10px; top:14px; background:none; border:none;
                  color:#0095f6; font-weight:bold; font-size:14px; cursor:pointer; }
  header button#btnProfil { left:10px; right:auto; }

  #auth { max-width:340px; margin:40px auto; padding:28px 22px; background:#fff;
          border:1px solid #dbdbdb; border-radius:10px; text-align:center; }
  #auth .logo { font-size:44px; margin:0 0 16px; }
  #auth input { width:100%; padding:11px; margin:5px 0; background:#fafafa;
                border:1px solid #dbdbdb; border-radius:6px; font-size:14px; }
  .btn { background:#0095f6; color:#fff; border:none; border-radius:8px;
         padding:10px 16px; font-weight:bold; font-size:14px; cursor:pointer; }
  .btn.gris { background:#efefef; color:#262626; }
  #auth .btn { width:100%; margin:6px 0 0; }
  #msg { color:#ed4956; font-size:13px; min-height:18px; }

  #publier { max-width:500px; margin:14px auto; padding:14px; background:#fff;
             border:1px solid #dbdbdb; border-radius:10px; }
  #publier input[type=text] { width:100%; padding:10px; margin:10px 0;
             border:1px solid #dbdbdb; border-radius:6px; font-size:14px; }
  #photo { display:none; }
  .fichier { display:inline-block; padding:10px 14px; border-radius:8px;
             background:#efefef; font-weight:bold; font-size:14px; cursor:pointer; }
  #etat { font-size:13px; margin-left:8px; }

  .post { background:#fff; max-width:500px; margin:14px auto;
          border:1px solid #dbdbdb; border-radius:10px; overflow:hidden; }
  .entete { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer; }
  .avatar { width:34px; height:34px; border-radius:50%; color:#fff; font-weight:bold;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
            background:linear-gradient(45deg,#f09433,#dc2743,#bc1888); }
  img.avatar { display:block; object-fit:cover; background:#efefef; }
  .avatar.grand { width:72px; height:72px; font-size:30px; }
  .nom { font-weight:bold; font-size:14px; }
  .suppr { margin-left:auto; background:none; border:none; font-size:20px; cursor:pointer; padding:4px 6px; }
  .post img.photo { width:100%; display:block; background:#efefef; }
  .actions { padding:10px 12px 4px; font-size:26px; }
  .coeur { cursor:pointer; }
  .nblikes { font-size:14px; font-weight:bold; margin-left:8px; }
  .legende, .com { padding:2px 12px; font-size:14px; line-height:1.4; }
  .nouveau { display:flex; gap:8px; padding:10px 12px 12px; border-top:1px solid #efefef; margin-top:8px; }
  .nouveau input { flex:1; padding:9px; border:1px solid #dbdbdb; border-radius:6px; }
  .nouveau button { background:none; border:none; color:#0095f6; font-weight:bold; cursor:pointer; }

  .retour { max-width:500px; margin:10px auto 0; padding:0 12px; }
  .retour button { background:none; border:none; color:#0095f6; font-weight:bold;
                   font-size:14px; cursor:pointer; padding:6px 0; }
  .profil-tete { max-width:500px; margin:8px auto 14px; padding:16px; background:#fff;
                 border:1px solid #dbdbdb; border-radius:10px;
                 display:flex; align-items:center; gap:16px; }
  .profil-nom { font-size:18px; font-weight:bold; }
  .profil-nb { font-size:14px; color:#737373; margin-top:4px; }
  .change { display:inline-block; margin-top:8px; padding:7px 12px; border-radius:8px;
            background:#efefef; font-weight:bold; font-size:13px; cursor:pointer; }
  .petit { font-size:12px; color:#737373; margin-left:6px; }
  .grille { max-width:500px; margin:0 auto 24px; display:grid;
            grid-template-columns:repeat(3,1fr); gap:3px; }
  .grille img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#efefef; }
  .vide { text-align:center; color:#737373; padding:30px; }
</style>
</head>
<body>

<div id="auth">
  <div class="logo">Photogram</div>
  <input id="pseudo" type="text" placeholder="Pseudo (seulement pour s'inscrire)">
  <input id="email" type="email" placeholder="Email">
  <input id="mdp" type="password" placeholder="Mot de passe (6 caractères min.)">
  <button class="btn" id="btnConnecter">Se connecter</button>
  <button class="btn gris" id="btnInscrire">S'inscrire</button>
  <p id="msg"></p>
</div>

<div id="app" style="display:none">
  <header>
    <button id="btnProfil">Profil</button>
    <span class="logo" id="logo">Photogram</span>
    <button id="btnQuitter">Quitter</button>
  </header>

  <div id="publier">
    <label class="fichier" for="photo">📷 Choisir une photo</label>
    <input id="photo" type="file" accept="image/*">
    <span id="etat"></span>
    <input id="legende" type="text" placeholder="Écris une légende...">
    <button class="btn" id="btnPublier">Publier</button>
  </div>

  <div id="fil"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, onAuthStateChanged, updateProfile }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot,
         serverTimestamp, doc, updateDoc, arrayUnion, arrayRemove, getDoc, setDoc, deleteDoc }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB3fKtSOEQb7RbFQaOShAQ2__hjuWCsHVU",
  authDomain: "photogram-98606.firebaseapp.com",
  projectId: "photogram-98606",
  storageBucket: "photogram-98606.firebasestorage.app",
  messagingSenderId: "402209948551",
  appId: "1:402209948551:web:7330d1625695eee2e50922"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let arreterFil = null;
let arreterProfils = null;
let docs = [];
let photos = {};
let profilActuel = null;

function nomUtilisateur() {
  const u = auth.currentUser;
  return u.displayName || u.email.split("@")[0];
}

// Réserve le pseudo d'un ancien compte s'il est encore libre
async function reserver(nom) {
  try {
    const ref = doc(db, "pseudos", nom.toLowerCase());
    const s = await getDoc(ref);
    if (!s.exists()) await setDoc(ref, { uid: auth.currentUser.uid });
  } catch (e) {}
}

$("btnInscrire").onclick = async () => {
  const pseudo = $("pseudo").value.trim();
  if (!/^[A-Za-z0-9_.-]{3,20}$/.test(pseudo)) {
    $("msg").textContent = "Pseudo : 3 à 20 caractères (lettres, chiffres, _ . -)";
    return;
  }
  $("msg").textContent = "";
  const cle = pseudo.toLowerCase();
  try {
    const existe = await getDoc(doc(db, "pseudos", cle));
    if (existe.exists()) {
      $("msg").textContent = "Ce pseudo est déjà pris";
      return;
    }
    const cred = await createUserWithEmailAndPassword(auth, $("email").value, $("mdp").value);
    try {
      await setDoc(doc(db, "pseudos", cle), { uid: cred.user.uid });
    } catch (e) {
      await cred.user.delete();
      $("msg").textContent = "Ce pseudo est déjà pris";
      return;
    }
    await updateProfile(cred.user, { displayName: pseudo });
  } catch (e) {
    $("msg").textContent = e.code;
  }
};

$("btnConnecter").onclick = () =>
  signInWithEmailAndPassword(auth, $("email").value, $("mdp").value)
    .catch(e => $("msg").textContent = e.code);

$("btnQuitter").onclick = () => signOut(auth);

$("btnProfil").onclick = () => ouvrirProfil(nomUtilisateur());
$("logo").onclick = () => { profilActuel = null; rendre(); window.scrollTo(0, 0); };

$("photo").onchange = () => {
  $("etat").textContent = $("photo").files[0] ? "Photo choisie ✅" : "";
};

onAuthStateChanged(auth, user => {
  $("auth").style.display = user ? "none" : "block";
  $("app").style.display = user ? "block" : "none";
  if (arreterFil) { arreterFil(); arreterFil = null; }
  if (arreterProfils) { arreterProfils(); arreterProfils = null; }
  profilActuel = null;
  docs = [];
  photos = {};
  if (user) {
    afficherFil();
    reserver(user.displayName || user.email.split("@")[0]);
  }
});

function reduirePhoto(fichier) {
  return new Promise((ok, erreur) => {
    const lecteur = new FileReader();
    lecteur.onerror = erreur;
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = erreur;
      img.onload = () => {
        const max = 600;
        const echelle = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = img.width * echelle;
        c.height = img.height * echelle;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL("image/jpeg", 0.6));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

// Photo de profil : carré recadré au centre
function reduireCarre(fichier, taille) {
  return new Promise((ok, erreur) => {
    const lecteur = new FileReader();
    lecteur.onerror = erreur;
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = erreur;
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = taille;
        c.height = taille;
        const cote = Math.min(img.width, img.height);
        const sx = (img.width - cote) / 2;
        const sy = (img.height - cote) / 2;
        c.getContext("2d").drawImage(img, sx, sy, cote, cote, 0, 0, taille, taille);
        ok(c.toDataURL("image/jpeg", 0.7));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

$("btnPublier").onclick = async () => {
  const fichier = $("photo").files[0];
  if (!fichier) { $("etat").textContent = "Choisis une photo d'abord"; return; }
  $("etat").textContent = "Publication...";
  try {
    const img = await reduirePhoto(fichier);
    await addDoc(collection(db, "posts"), {
      user: nomUtilisateur(),
      texte: $("legende").value,
      img: img,
      likes: [],
      commentaires: [],
      date: serverTimestamp()
    });
    $("photo").value = "";
    $("legende").value = "";
    $("etat").textContent = "Publié ✅";
  } catch (e) {
    $("etat").textContent = "Erreur : " + e.code;
  }
};

function afficherFil() {
  const q = query(collection(db, "posts"), orderBy("date", "desc"));
  arreterFil = onSnapshot(q, snap => {
    docs = snap.docs;
    rendre();
  });
  arreterProfils = onSnapshot(collection(db, "profils"), snap => {
    photos = {};
    snap.forEach(d => { photos[d.id] = d.data().img; });
    rendre();
  }, () => {});
}

function ouvrirProfil(nom) {
  profilActuel = nom;
  rendre();
  window.scrollTo(0, 0);
}

// Pastille ou photo de profil
function avatar(nom, grand) {
  const img = photos[(nom || "").toLowerCase()];
  if (img && String(img).startsWith("data:image/")) {
    const im = document.createElement("img");
    im.className = "avatar" + (grand ? " grand" : "");
    im.src = img;
    return im;
  }
  const d = document.createElement("div");
  d.className = "avatar" + (grand ? " grand" : "");
  d.textContent = (nom || "?").charAt(0).toUpperCase();
  return d;
}

function rendre() {
  $("fil").innerHTML = "";
  $("publier").style.display = profilActuel ? "none" : "block";
  if (profilActuel) { rendreProfil(); return; }
  docs.forEach(d => $("fil").append(carte(d)));
}

function rendreProfil() {
  const mes = docs.filter(d => d.data().user === profilActuel);
  const cestMoi = profilActuel.toLowerCase() === nomUtilisateur().toLowerCase();

  const retour = document.createElement("div");
  retour.className = "retour";
  const br = document.createElement("button");
  br.textContent = "← Retour au fil";
  br.onclick = () => { profilActuel = null; rendre(); };
  retour.append(br);

  const tete = document.createElement("div");
  tete.className = "profil-tete";
  const av = avatar(profilActuel, true);
  const infos = document.createElement("div");
  const nom = document.createElement("div");
  nom.className = "profil-nom";
  nom.textContent = profilActuel;
  const nb = document.createElement("div");
  nb.className = "profil-nb";
  nb.textContent = mes.length + (mes.length > 1 ? " publications" : " publication");
  infos.append(nom, nb);

  if (cestMoi) {
    const lab = document.createElement("label");
    lab.className = "change";
    lab.textContent = "📷 Changer ma photo";
    const champ = document.createElement("input");
    champ.type = "file";
    champ.accept = "image/*";
    champ.style.display = "none";
    const info = document.createElement("span");
    info.className = "petit";
    champ.onchange = async () => {
      const f = champ.files[0];
      if (!f) return;
      info.textContent = "Envoi...";
      try {
        const img = await reduireCarre(f, 200);
        await setDoc(doc(db, "profils", nomUtilisateur().toLowerCase()),
                     { uid: auth.currentUser.uid, img: img });
        info.textContent = "";
      } catch (e) {
        info.textContent = "Erreur : " + (e.code || "photo invalide");
      }
    };
    lab.append(champ);
    infos.append(lab, info);
  }

  tete.append(av, infos);
  $("fil").append(retour, tete);

  if (mes.length === 0) {
    const v = document.createElement("div");
    v.className = "vide";
    v.textContent = "Aucune photo pour le moment";
    $("fil").append(v);
    return;
  }

  const grille = document.createElement("div");
  grille.className = "grille";
  mes.forEach(d => {
    const im = document.createElement("img");
    im.src = d.data().img;
    grille.append(im);
  });
  $("fil").append(grille);
}

function carte(d) {
  const uid = auth.currentUser.uid;
  const p = d.data();
  const ref = doc(db, "posts", d.id);
  const likes = p.likes || [];
  const aime = likes.includes(uid);
  const cestMoi = (p.user || "").toLowerCase() === nomUtilisateur().toLowerCase();

  const div = document.createElement("div");
  div.className = "post";

  const ent = document.createElement("div");
  ent.className = "entete";
  ent.onclick = () => ouvrirProfil(p.user);
  const nom = document.createElement("div");
  nom.className = "nom";
  nom.textContent = p.user;
  ent.append(avatar(p.user, false), nom);

  if (cestMoi) {
    const sup = document.createElement("button");
    sup.className = "suppr";
    sup.textContent = "🗑️";
    sup.onclick = async e => {
      e.stopPropagation();
      if (!confirm("Supprimer cette publication ?")) return;
      try {
        await deleteDoc(ref);
      } catch (err) {
        alert("Suppression impossible : " + err.code);
      }
    };
    ent.append(sup);
  }

  const im = document.createElement("img");
  im.className = "photo";
  im.src = p.img;

  const a = document.createElement("div");
  a.className = "actions";
  const coeur = document.createElement("span");
  coeur.className = "coeur";
  coeur.textContent = aime ? "❤️" : "🤍";
  coeur.onclick = () =>
    updateDoc(ref, { likes: aime ? arrayRemove(uid) : arrayUnion(uid) });
  const nb = document.createElement("span");
  nb.className = "nblikes";
  nb.textContent = likes.length + " j'aime";
  a.append(coeur, nb);

  const l = document.createElement("div");
  l.className = "legende";
  const ln = document.createElement("b");
  ln.textContent = p.user + " ";
  l.append(ln, document.createTextNode(p.texte || ""));

  div.append(ent, im, a, l);

  (p.commentaires || []).forEach(c => {
    const ligne = document.createElement("div");
    ligne.className = "com";
    const cn = document.createElement("b");
    cn.textContent = c.user + " ";
    ligne.append(cn, document.createTextNode(c.texte));
    div.append(ligne);
  });

  const nouveau = document.createElement("div");
  nouveau.className = "nouveau";
  const champ = document.createElement("input");
  champ.type = "text";
  champ.placeholder = "Ajouter un commentaire...";
  const bouton = document.createElement("button");
  bouton.textContent = "Publier";
  bouton.onclick = () => {
    const t = champ.value.trim();
    if (!t) return;
    updateDoc(ref, { commentaires: arrayUnion({ user: nomUtilisateur(), texte: t }) });
  };
  nouveau.append(champ, bouton);
  div.append(nouveau);

  return div;
}
</script>
</body>
   </html>
